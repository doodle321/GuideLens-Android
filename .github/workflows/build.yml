name: Build & test

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      # Models: restore from cache or download via the checksum-guarded task.
      - name: Restore models from cache
        id: models-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/*.tflite
          key: guidelens-models-v1
          restore-keys: guidelens-models-

      - name: Fetch models (if not cached)
        run: gradle downloadModels

      - name: Record model checksums
        run: sha256sum app/src/main/assets/*.tflite || true

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle lint

      - name: Build release APK (R8 on)
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: guidelens-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html
          if-no-files-found: ignore
          retention-days: 30
