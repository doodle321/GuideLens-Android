// Endpoints are build-time configurable for anyone self-hosting OSRM/Nominatim
// (both public demo instances have strict usage policies):
//   ./gradlew assembleRelease -Posrm.base=https://your.server -Pnominatim.base=... -Pcontact.email=you@example.org
def osrmBase = (project.findProperty("osrm.base") ?: "https://routing.openstreetmap.de").toString().replaceAll('/$', "")
def nominatimBase = (project.findProperty("nominatim.base") ?: "https://nominatim.openstreetmap.org").toString().replaceAll('/$', "")
def contactEmail = (project.findProperty("contact.email") ?: "guidelens-dev@example.org").toString()

android {
    namespace 'com.guidelens.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.guidelens.app"
        minSdk 26           // adaptive icons; 99%+ of active devices
        targetSdk 35
        versionCode 5
        versionName "1.4.0"

        buildConfigField "String", "OSRM_BASE", "\"${osrmBase}\""
        buildConfigField "String", "NOMINATIM_BASE", "\"${nominatimBase}\""
        buildConfigField "String", "NOMINATIM_CONTACT", "\"${contactEmail}\""
        buildConfigField "String", "NOMINATIM_UA", "\"GuideLens/1.4.0 (${contactEmail})\""
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            minifyEnabled false
        }
    }

    androidResources { noCompress 'tflite' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    testOptions { unitTests.returnDefaultValues = true }
}

